[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-red-team-cli"
version = "0.2.0"
description = "Adversarial test harness for LLM applications. Canary-based, deterministic detection of prompt injection, jailbreaks, system-prompt leakage and PII disclosure."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "MRX-72" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "jailbreak", "owasp", "ai-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "litellm>=1.40",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
  "tenacity>=8.0",   # litellm.num_retries needs it but does not declare it
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/MRX-72/llm-red-team-cli"
Issues = "https://github.com/MRX-72/llm-red-team-cli/issues"

[project.scripts]
lrt = "llm_red_team.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_red_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
